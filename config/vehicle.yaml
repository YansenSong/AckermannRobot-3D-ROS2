# Project-level real-vehicle configuration.
#
# This file is intentionally NOT a ROS package. It is the single project-level
# source for vehicle geometry, hard actuation limits, planning limits, and
# calibrated sensor extrinsics. Device/network settings (LiDAR IP, STM32 IP,
# serial ports, etc.) stay with their owning drivers.
#
# Geometry values marked VERIFIED below are measured real-vehicle values.
# Parameters that still need measurement/calibration remain explicitly marked
# NOT VERIFIED so the real-vehicle stack cannot silently fall back to old data.

schema_version: 1
status: "PARTIALLY VERIFIED"

vehicle:
  geometry:
    status: "VERIFIED"
    # Measured real-vehicle dimensions.
    length: 1.360
    width: 0.900
    wheelbase: 0.960
    track_width: 0.750
    wheel_diameter: 0.400
    wheel_radius: 0.200

    # Axle-to-body distances. rear_overhang is measured directly. front_overhang
    # is derived from length - wheelbase - rear_overhang.
    rear_overhang: 0.200
    front_overhang: 0.200

  frames:
    base: "rear_axle_link"
    lidar: "laser_link"
    imu: "imu_link"

  control_limits:
    # Existing STM32 bridge limits. Steering/speed limits are not changed by
    # this geometry update and should be verified independently on the vehicle.
    status: "NOT VERIFIED"
    max_forward_speed: 2.0
    max_reverse_speed: -0.5
    max_steering_angle_deg: 30.0

  planning:
    # Conservative operating limits used by NeuPAN / Smac.
    reference_speed: 0.5
    max_forward_speed: 0.7
    max_acceleration: 1.0
    max_steering_rate: 0.328

    # Derived from the measured 0.960 m wheelbase and the currently configured
    # 30 deg steering limit: R = L / tan(delta) ~= 1.663 m.
    # Recompute this value if the verified steering limit changes.
    minimum_turning_radius: 1.663

    # Collision envelope is relative to frames.base = rear_axle_link.
    # rear_extent is the measured rear-axle-to-tail distance. front_extent is
    # derived from total body length: 1.360 - 0.200 = 1.160 m.
    footprint:
      status: "VERIFIED"
      front_extent: 1.160
      rear_extent: 0.200
      half_width: 0.450
      padding: 0.01

  sensor_extrinsics:
    # Single source for the LiDAR/IMU calibration consumed by both LIORF and
    # LIO-SAM. Do not copy these values into package-local parameter files.
    #
    # The fields intentionally map directly to the LIO-SAM/LIORF parameter
    # conventions instead of converting through Euler angles at launch time:
    #   translation_xyz -> extrinsicTrans
    #   rotation_matrix -> extrinsicRot
    #   orientation_matrix -> extrinsicRPY
    lidar_to_imu:
      status: "NOT VERIFIED"

      # LiDAR origin -> IMU origin translation [x, y, z], expressed in the
      # LiDAR frame, in metres.
      translation_xyz: null

      # Row-major 3x3 matrix used to rotate IMU acceleration/gyro vectors into
      # the LiDAR convention (LIO-SAM/LIORF extrinsicRot).
      rotation_matrix: null

      # Row-major 3x3 IMU orientation correction matrix
      # (LIO-SAM/LIORF extrinsicRPY). Keep separate from rotation_matrix because
      # some IMUs use different attitude and vector axis conventions.
      orientation_matrix: null
