# Project-level real-vehicle configuration.
#
# This file is intentionally NOT a ROS package. It is the single project-level
# source for vehicle geometry, hard actuation limits, and planning limits.
# Device/network settings (LiDAR IP, STM32 IP, serial ports, etc.) stay with
# their owning drivers.
#
# IMPORTANT: geometry and planning-envelope values below preserve the values
# currently used by this branch. They are NOT VERIFIED against the final real
# vehicle yet. Replace them with measured values before real navigation tuning.

schema_version: 1
status: "NOT VERIFIED"

vehicle:
  geometry:
    # NOT VERIFIED: current NeuPAN baseline values.
    length: 0.720
    width: 0.500
    wheelbase: 0.593

  frames:
    base: "rear_axle_link"
    lidar: "laser_link"
    imu: "imu_link"

  control_limits:
    # Hard limits enforced by the STM32 motion-control bridge.
    max_forward_speed: 2.0
    max_reverse_speed: -0.5
    max_steering_angle_deg: 30.0

  planning:
    # Conservative operating limits used by NeuPAN / Smac.
    reference_speed: 0.5
    max_forward_speed: 0.7
    max_acceleration: 1.0
    max_steering_rate: 0.328
    minimum_turning_radius: 1.320

    # NOT VERIFIED: current Smac collision envelope relative to frames.base.
    footprint:
      front_extent: 0.74
      rear_extent: 0.10
      half_width: 0.36
      padding: 0.01

  sensor_extrinsics:
    # Fill these after physical measurement/calibration. Localization keeps its
    # existing local parameters until these become VERIFIED.
    lidar_to_imu:
      status: "NOT VERIFIED"
      translation_xyz: null
      rotation_rpy: null
