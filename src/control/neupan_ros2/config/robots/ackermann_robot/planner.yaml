# NeuPAN algorithm template for the real Ackermann vehicle.
#
# Vehicle geometry, speed limits, steering limits, and minimum turning radius
# are intentionally NOT stored here. scripts/run_neupan.sh renders a temporary
# planner YAML from the project-level config/vehicle.yaml before starting the
# node. This file only keeps NeuPAN algorithm/tuning parameters.

receding: 15
step_time: 0.2
device: 'cpu'
time_print: False
collision_threshold: 0.01

robot:
  kinematics: 'acker'
  # Injected at runtime from config/vehicle.yaml:
  #   max_speed
  #   max_acce
  #   length
  #   width
  #   wheelbase

ipath:
  interval: 0.03
  # waypoints: [[0, 0, 0], [1, 0, 0]]
  curve_style: 'dubins'   # 'dubins' or reeds or line
  # min_radius is injected at runtime from config/vehicle.yaml.
  loop: False
  arrive_threshold: 0.5
  close_threshold: 0.05
  arrive_index_threshold: 3

# proximal alternating minimization network
pan:
  iter_num: 2
  dune_max_num: 200
  nrmp_max_num: 10
  dune_checkpoint: None
  iter_threshold: 0.1

# adjust parameters
adjust:
  q_s: 0.1
  p_u: 0.5
  eta: 15.0
  d_max: 0.1
  d_min: 0.01
