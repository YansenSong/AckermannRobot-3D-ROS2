/**:
  ros__parameters:
    use_sim_time: false
    target_frame: base_link
    # Height slice relative to laser_link
    # Filter out ground returns below LiDAR mounting height
    min_height: -0.4                # Filter ground returns below LiDAR
    max_height: 1.0                # Capture obstacles up to 1m above base_link
    # Full 360° scan
    angle_min: -3.14159
    angle_max: 3.14159
    angle_increment: 0.0087              # ~0.5° per ray → 720 points
    scan_time: 0.1                       # 10 Hz
    range_min: 0.15
    range_max: 50.0
    concurrency_level: 1
