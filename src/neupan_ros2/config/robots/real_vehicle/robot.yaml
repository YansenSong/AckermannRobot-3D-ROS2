# NeuPAN ROS2 Configuration — Real Vehicle
#
# Vehicle: Ackermann steering with shared real-sensor configuration
# TF: map → base_link (static bootstrap until localization ready)
#     base_link → hesai_lidar (static, LiDAR mounting position)

neupan_node:
  ros__parameters:
    use_sim_time: false

    # Robot identification
    robot_type: 'real_vehicle'
    robot_description: 'Real Ackermann vehicle (shared vehicle and sensor config)'

    # Configuration file paths (relative to robot directory)
    planner_config_file: 'planner.yaml'
    dune_checkpoint_file: 'models/dune_model_5000.pth'

    # ---- TF Frame Configuration -------------------------------------
    map_frame: 'map'
    base_frame: 'base_link'
    # lidar_frame is injected from the shared sensor configuration.

    # ---- Topic Configuration ----------------------------------------
    cmd_vel_topic: '/cmd_vel'               # Direct to motion_control bridge_node
    # scan_topic is injected from the shared sensor configuration.
    plan_input_topic: '/plan'               # From hybrid_astar_planner
    goal_topic: '/goal_pose'                # Nav2 goal (optional)
    plan_output_topic: '/neupan_plan'       # Optimized trajectory (visualization)
    ref_state_topic: '/neupan_ref_state'    # Reference state (visualization)
    initial_path_topic: '/neupan_initial_path'
    dune_markers_topic: '/dune_point_markers'
    robot_marker_topic: '/robot_marker'
    nrmp_markers_topic: '/nrmp_point_markers'

    # ---- Visualization ----------------------------------------------
    enable_visualization: false             # Disabled on real vehicle for performance
    enable_dune_markers: false
    enable_nrmp_markers: false
    enable_robot_marker: false
    marker_size: 0.05
    marker_z: 0.5

    # Laser scan frame/topic/filtering parameters are injected from
    # vehicle_config/config/real_vehicle.yaml.

    # ---- Path Planning ----------------------------------------------
    flip_angle: false
    refresh_initial_path: true              # Re-plan when new global path arrives
    include_initial_path_direction: true    # Detect gear from path pose orientations
    control_frequency: 20.0                 # 20 Hz (matching bridge_node)
