# Official Ranger baseline MPC values, with current Ackermann speed limits.
receding: 15
step_time: 0.2
ref_speed: 0.5
device: 'cpu'
time_print: False
collision_threshold: 0.01

# The second max_speed entry is the bicycle-model steering angle (rad), not
# the physical inner-wheel joint angle.  atan(wheelbase / Smac_Rmin) gives the
# steering limit compatible with the global planner.
robot:
  kinematics: 'acker'
  max_speed: [0.7, 0.422]
  max_acce: [1.0, 0.328]
  length: 0.720
  width: 0.500
  wheelbase: 0.593

# initial path
ipath:
  interval: 0.03
  # waypoints: [[0, 0, 0], [1, 0, 0]]
  curve_style: 'dubins'   # 'dubins' or reeds or line
  min_radius: 1.320
  loop: False
  arrive_threshold: 0.5
  close_threshold: 0.05
  arrive_index_threshold: 3

# proximal alternating minimization network
pan:
  iter_num: 2
  dune_max_num: 200
  nrmp_max_num: 10
  dune_checkpoint: None
  iter_threshold: 0.1

# adjust parameters
adjust:
  q_s: 0.1
  p_u: 0.5
  eta: 15.0
  d_max: 0.1
  d_min: 0.01
