# NeuPAN ROS2 baseline configuration for the AckermannRobot simulation.
# This profile keeps the official Ranger field set and only changes the
# integration-facing frames, topics, and hardware limits.

neupan_node:
  ros__parameters:
    use_sim_time: true

    # Robot identification
    robot_type: 'ackermann_robot'
    robot_description: 'AckermannRobot Gazebo simulation'

    # Configuration file paths (relative to robot directory)
    planner_config_file: 'planner.yaml'
    dune_checkpoint_file: 'models/dune_model_5000.pth'

    # TF Frame configuration
    map_frame: 'map'           # Global map coordinate frame
    base_frame: 'rear_axle_link'  # NeuPAN/Smac bicycle-model reference frame
    lidar_frame: 'laser_link'     # LiDAR frame

    # ========== Visualization Configuration ==========
    enable_visualization: true   # Master switch for all visualization
    enable_dune_markers: true    # Enable DUNE point cloud markers
    enable_nrmp_markers: true    # Enable NRMP point cloud markers
    enable_robot_marker: true    # Enable robot footprint marker
    marker_size: 0.05            # DUNE/NRMP point marker size
    marker_z: 1.0                # Robot marker height

    # ========== Laser Scan Processing Configuration ==========
    scan_angle_max: 3.14       # Maximum scan angle (180 degrees)
    scan_angle_min: -3.14      # Minimum scan angle (-180 degrees)
    scan_downsample: 1         # Scan downsampling rate (1=use all points)
    scan_range_max: 5.0        # Keep the official Ranger baseline range
    scan_range_min: 0.15       # Physical minimum range of the simulated LiDAR

    # ========== Path Planning Configuration ==========
    flip_angle: false                       # Whether to flip scan angles
    refresh_initial_path: true              # Refresh path when receiving new path
    include_initial_path_direction: true    # Preserve Smac pose heading/gear
    control_frequency: 50.0                 # Control loop frequency (Hz)

    # ========== Topic Configuration ==========
    # NeuPAN receives the global path from Smac and does not own /goal_pose.
    cmd_vel_topic: '/neupan_cmd_vel_raw'
    scan_topic: '/scan'
    plan_input_topic: '/plan'
    goal_topic: '/neupan_unused_goal'
    plan_output_topic: '/neupan_plan'
    ref_state_topic: '/neupan_ref_state'
    initial_path_topic: '/neupan_initial_path'
    dune_markers_topic: '/dune_point_markers'
    robot_marker_topic: '/robot_marker'
    nrmp_markers_topic: '/nrmp_point_markers'
