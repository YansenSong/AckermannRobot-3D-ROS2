# 实车与传感器参数的唯一数据源。
#
# 车体尺寸、运动学限制和传感器安装位姿只在此处修改。
# NeuPAN、Hybrid A* 和 motion_control 会在启动时自动读取并注入这些参数。
# 坐标约定：base_link 原点位于后轴中心，X 轴向前、Y 轴向左、Z 轴向上。

vehicle:
  length: 1.34                 # 车辆总长，从前端到后端（m）
  width: 0.91                  # 车辆总宽（m）
  wheelbase: 0.97              # 前后轴中心距离（m）
  wheel_radius: 0.205          # 轮子实际半径（m）
  rear_axle_offset_x: 0.0      # 后轴中心相对 base_link 的 X 向偏移（m）；两者重合

  max_steer_deg: 30.0          # 单侧最大转向角（度）
  max_forward_speed: 2.0       # 最大前进指令速度（m/s）
  max_reverse_speed: -0.5      # 最大倒车指令速度（m/s，负值）

sensors:
  lidar:
    installed: true
    model: "Hesai PandarXT-16"               # 雷达型号

    driver:
      device_ip_address: "192.168.1.201"     # 雷达设备 IP
      udp_port: 2368                          # 点云 UDP 端口
      ptc_port: 9347                          # PTC 管理端口
      correction_file_path: "src/driver/HesaiLidar_SDK_2.0/correction/angle_correction/PandarXT-16_Angle Correction File.csv"
      firetimes_path: "src/driver/HesaiLidar_SDK_2.0/correction/firetime_correction/PandarXT-16_Firetime Correction File.csv"
      frame_frequency: 10.0                   # 点云帧率（Hz）

    frames:
      sensor: "hesai_lidar"                  # 雷达原始点云坐标系
      scan_target: "base_link"               # 二维激光扫描的目标坐标系

    topics:
      packets: "/lidar_packets"
      points: "/lidar_points"
      packet_loss: "/lidar_packets_loss"
      scan: "/scan"

    mount:
      x: 0.0                                 # 雷达中心相对 base_link 的 X 向偏移（m），待实车测量
      y: 0.0
      z: 0.4
      roll: 0.0                              # 雷达相对 base_link 的姿态角（rad）
      pitch: 0.0
      yaw: 0.0

    scan:
      # 以下是二维扫描处理初值，并非全部来自雷达铭牌；实车采样后需要标定。
      angle_min: -3.14159                    # 暂按 360° 水平视场设置（rad）
      angle_max: 3.14159                     # 暂按 360° 水平视场设置（rad）
      angle_increment: 0.00314                # 输出栅格约 0.5°，待按点云密度确认
      scan_time: 0.1                         # 对应 10 Hz 帧率；修改帧率时同步修改
      range_min: 0.3                         # 近距过滤阈值，待根据车体自反射标定
      range_max: 30.0                        # 算法处理上限，待根据场景标定
      downsample: 2                          # NeuPAN 降采样倍率，待按算力和效果调优
      min_height: -0.4                       # 相对 base_link 的切片下限，待实车标定
      max_height: 1.0                        # 相对 base_link 的切片上限，待实车标定

  imu:
    installed: false                         # IMU 尚未安装
    model: null                              # 型号待确认
    frame_id: null                           # 坐标系待确认
    topic: null                              # 话题待确认
    mount:                                   # 安装位姿待实车测量
      x: null
      y: null
      z: null
      roll: null
      pitch: null
      yaw: null
    parameters: {}                           # 采样率、噪声和零偏等参数待确认
