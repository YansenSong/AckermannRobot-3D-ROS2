/**:
  ros__parameters:
    # ---- 地图 (由 launch 文件设置) ----
    map_path: ""
    resolution: 0.05
    origin_x: 0.0
    origin_y: 0.0

    # ---- 车辆运动学 (小型阿克曼: 0.70m×0.52m, wheelbase=0.593m) ----
    minimum_turning_radius: 1.05        # wheelbase / tan(max_steering) = 0.593 / tan(0.52)
    angle_quantization: 72              # 5° per bin (360/72)
    motion_model: "REEDS_SHEPP"         # 支持前进+倒车

    # ---- 车体尺寸 (相对后轴) ----
    robot_state_frame: rear_axle_link   # A* state/reference point
    goal_pose_is_base_link: true        # RViz goal denotes the vehicle center
    rear_axle_offset_x: -0.30449        # URDF rear axle x relative to base_link
    vehicle_length: 0.70                # 总长 (m)
    vehicle_width: 0.52                 # 总宽 (m)
    remaining_distance_topic: "/global_path_remaining_distance"  # 剩余路径距离 (m)

    # ---- 搜索参数 ----
    max_iterations: 50000
    max_on_approach_iterations: 1000
    tolerance: 0.10                     # 目标容差 (m)，约 2 个栅格
    allow_unknown: false                # 静态地图中未知区域按不可通行处理

    # ---- 代价惩罚 ----
    change_penalty: 2.0                 # 左/右转向切换惩罚
    non_straight_penalty: 1.2
    reverse_penalty: 5.0                # 倒车惩罚 (>1 减少不必要倒车)
    gear_change_penalty: 4.0            # 前进/倒车换挡惩罚
    cost_penalty: 2.0                   # 更偏向通道中部
    analytic_expansion_ratio: 3.5
    analytic_expansion_max_length: 5.0  # m；约为最小转弯半径的 4.8 倍

    # ---- 路径平滑 (默认关闭) ----
    use_smoother: false
    smooth_max_time: 0.1
    smooth_max_iterations: 50
