/**:
  ros__parameters:
    use_sim_time: true
    target_frame: laser_link
    # Height slice relative to laser_link (LiDAR at z≈0.384 in base_link)
    # Ground is below, scan horizontal forward
    min_height: -0.5
    max_height: 2.0
    # Full 360° scan
    angle_min: -3.14159
    angle_max: 3.14159
    angle_increment: 0.0087   # ~0.5° per ray → 720 points
    scan_time: 0.1            # 10 Hz
    range_min: 0.15
    range_max: 25.0
    concurrency_level: 1
