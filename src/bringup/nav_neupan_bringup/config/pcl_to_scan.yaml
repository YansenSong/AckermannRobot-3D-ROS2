/**:
  ros__parameters:
    # use_sim_time and min_height are NOT set here; navigation.launch.py
    # supplies both so this file cannot pin the node on its own:
    #   - use_sim_time comes from the launch argument. This file used to say
    #     true, which left the node waiting on /clock that no real vehicle
    #     publishes.
    #   - min_height is derived from vehicle.sensor_mounting.lidar in
    #     config/vehicle.yaml. This file used to hold -0.40, which was derived
    #     from Gazebo geometry ("LiDAR is z=0.484m in the world") rather than
    #     measured on the vehicle.
    target_frame: laser_link
    max_height: 2.0
    # Full 360° scan
    angle_min: -3.14159
    angle_max: 3.14159
    angle_increment: 0.0087   # ~0.5° per ray → 720 points
    scan_time: 0.1            # 10 Hz
    range_min: 0.15
    range_max: 50.0               # 25.0 -> 50.0
    concurrency_level: 1
