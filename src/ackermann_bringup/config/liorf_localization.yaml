/**:
  ros__parameters:
    history_policy: "history_keep_last"
    reliability_policy: "reliability_reliable"

    # Inputs and public output
    pointCloudTopic: "/points_lio"
    imuTopic: "/imu/data"
    odomTopic: "/odom"
    gpsTopic: "/odometry/gpsz"

    # Frames. lidarFrame and baselinkFrame are overridden at launch from
    # vehicle.frames in config/vehicle.yaml; the values here are the same names
    # so this file stays correct when read on its own.
    #
    # baselinkFrame is frames.base (rear_axle_link), NOT a separate "base_link".
    # LIORF publishes odometry in baselinkFrame and looks up the fixed
    # lidarFrame->baselinkFrame transform, so naming it base_link -- a frame
    # nothing on the real vehicle defines -- split the TF tree in two and left
    # both LIORF and Nav2 unable to resolve their frames.
    lidarFrame: "laser_link"
    baselinkFrame: "rear_axle_link"
    odometryFrame: "odom"
    mapFrame: "map"

    # The launch file overrides this with an absolute map path.
    globalmap_pcd: ""

    # No GPS is used in the current real-vehicle localization path.
    useImuHeadingInitialization: false
    useGpsElevation: false
    gpsCovThreshold: 2.0
    poseCovThreshold: 25.0

    # Sensor model settings; verify against the real LiDAR before tuning.
    sensor: "velodyne"
    N_SCAN: 16
    Horizon_SCAN: 1800
    downsampleRate: 1
    point_filter_num: 3
    lidarMinRange: 1.0
    lidarMaxRange: 1000.0

    # IMU noise settings; these remain calibration/tuning parameters local to
    # LIORF. Physical LiDAR/IMU mounting extrinsics come only from
    # root config/vehicle.yaml at launch time.
    imuType: 1
    imuRate: 100.0
    imuAccNoise: 3.9939570888238808e-03
    imuGyrNoise: 1.5636343949698187e-03
    imuAccBiasN: 6.4356659353532566e-05
    imuGyrBiasN: 3.5640318696367613e-05
    imuGravity: 9.80511
    imuRPYWeight: 0.01

    # REQUIRED runtime overrides from config/vehicle.yaml:
    #   lidarFrame
    #   baselinkFrame
    #   extrinsicTrans
    #   extrinsicRot
    #   extrinsicRPY
    # They are intentionally not duplicated here.

    # Localization scan-to-map parameters. Tune one variable at a time only
    # after the complete input/TF path is known to work.
    mappingSurfLeafSize: 0.2
    surroundingKeyframeMapLeafSize: 0.2
    mappingProcessInterval: 0.05
    numberOfCores: 4
    surroundingkeyframeAddingDistThreshold: 0.5
    surroundingkeyframeAddingAngleThreshold: 0.2
    surroundingKeyframeDensity: 2.0
    surroundingKeyframeSearchRadius: 15.0

    # Localization uses the fixed prior map; do not run loop closure.
    loopClosureEnableFlag: false

    z_tollerance: 1000.0
    rotation_tollerance: 1000.0

    # Retain upstream defaults for unused loop-closure and visualization
    # parameters so every liorf node receives a complete parameter set.
    loopClosureFrequency: 1.0
    surroundingKeyframeSize: 50
    historyKeyframeSearchRadius: 15.0
    historyKeyframeSearchTimeDiff: 30.0
    historyKeyframeSearchNum: 25
    historyKeyframeFitnessScore: 0.3
    loopClosureICPSurfLeafSize: 0.3
    globalMapVisualizationSearchRadius: 50.0
    globalMapVisualizationPoseDensity: 10.0
    globalMapVisualizationLeafSize: 1.0
    savePCD: false
    savePCDDirectory: "/Downloads/LOAM/"
