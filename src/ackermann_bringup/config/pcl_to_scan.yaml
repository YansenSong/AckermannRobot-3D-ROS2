/**:
  ros__parameters:
    use_sim_time: true
    target_frame: laser_link
    # Height slice relative to laser_link.  The robot is spawned at z=0.1m
    # and the LiDAR is z≈0.484m in the world, so the flat ground is about
    # -0.484m below laser_link.  Keep a small ground margin while retaining
    # low static obstacles (the previous -0.15m missed obstacles below 0.33m).
    min_height: -0.40
    max_height: 2.0
    # Full 360° scan
    angle_min: -3.14159
    angle_max: 3.14159
    angle_increment: 0.0087   # ~0.5° per ray → 720 points
    scan_time: 0.1            # 10 Hz
    range_min: 0.15
    range_max: 50.0               # 25.0 -> 50.0
    concurrency_level: 1
