/**:
  ros__parameters:
    # Canonical Ackermann command:
    #   linear.x  = longitudinal speed (m/s)
    #   angular.z = front-wheel steering angle (rad)
    command_topic: "/ackermann_cmd"

    # --- UDP communication ---
    # Deployment/device settings stay local to motion_control.
    udp_host: "192.168.1.50"
    udp_port: 5000
    bind_device: "enp5s0"
    bind_interface: "192.168.1.11"

    # Vehicle hard limits are supplied by ackermann_bringup from the project
    # root config/vehicle.yaml. They are intentionally not duplicated here.

    # --- Actuator enable mask ---
    # bit0: RT49 (drive), bit1: EPS (steering), bit2: SEB (brake)
    enable_mask: 7

    # --- Control timing ---
    publish_rate: 20.0
    # Seconds without /ackermann_cmd before sending zero-velocity safety frames.
    command_timeout: 0.5
