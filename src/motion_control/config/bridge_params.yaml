/**:
  ros__parameters:
    # --- UDP communication ---
    # Target motion control board IP address.
    udp_host: "192.168.1.50"
    # Target UDP port (Ethernet-to-Serial bridge listening port).
    udp_port: 5000
    # Force socket to use this network device for egress (SO_BINDTODEVICE).
    # Adjust this for the target computer before real-vehicle deployment.
    bind_device: "enp5s0"
    # Optional source IP/interface binding. Adjust for the target computer.
    bind_interface: "192.168.1.11"

    # Vehicle geometry and motion limits are intentionally not centralized in
    # this branch yet. Values not specified here fall back to bridge_node
    # defaults and may be overridden later once the real-vehicle parameter
    # strategy is finalized.

    # --- Actuator enable mask ---
    # bit0: RT49 (drive), bit1: EPS (steering), bit2: SEB (brake)
    # 7 = all enabled, 3 = drive+steering only, etc.
    enable_mask: 7

    # --- Control timing ---
    # Frame publish rate (Hz), matches STM32 20ms control period.
    publish_rate: 20.0
    # Seconds without cmd_vel before sending zero-velocity safety frames.
    command_timeout: 0.5
