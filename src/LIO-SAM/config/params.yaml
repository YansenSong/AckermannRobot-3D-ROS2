/**:
  ros__parameters:

    # Topics
    pointCloudTopic: "/lidar_points"              # Hesai 点云话题
    imuTopic: "/imu/data"                         # IMU 尚未安装，安装后需确认
    odomTopic: "odometry/imu"                    # IMU pre-preintegration odometry, same frequency as IMU
    gpsTopic: "odometry/gpsz"                    # GPS odometry topic from navsat, see module_navsat.launch file

    # Frames
    lidarFrame: "hesai_lidar"
    baselinkFrame: "base_link"
    odometryFrame: "odom"
    mapFrame: "map"

    # GPS Settings
    useImuHeadingInitialization: false           # if using GPS data, set to "true"
    useGpsElevation: false                       # if GPS elevation is bad, set to "false"
    gpsCovThreshold: 2.0                         # m^2, threshold for using GPS data
    poseCovThreshold: 25.0                       # m^2, threshold for using GPS data

    # Export settings
    savePCD: false                               # https://github.com/TixiaoShan/LIO-SAM/issues/3
    # LIO-SAM 运行时会在前面拼接 $HOME，避免写死具体用户名。
    savePCDDirectory: "/AckermannRobot-3D/src/maps/"

    # Sensor Settings
    sensor: velodyne                             # lidar sensor type, either 'velodyne', 'ouster' or 'livox'
    N_SCAN: 16                                   # Hesai PandarXT-16 线数
    Horizon_SCAN: 1800                           # 待按实车点云组织方式确认
    downsampleRate: 1                            # default: 1. Downsample your data if too many
    # points. i.e., 16 = 64 / 4, 16 = 16 / 1
    lidarMinRange: 1.0                           # default: 1.0, minimum lidar range to be used
    lidarMaxRange: 1000.0                        # default: 1000.0, maximum lidar range to be used

    # IMU Settings
    # 注：以下 4 个噪声参数目前仍是仓库示例默认值，待 ≥40min 静止录包后用
    # scripts/imu_calibration/allan_variance.py 更新（5min 初步估计：
    # imuAccNoise≈6.6e-4, imuGyrNoise≈1.1e-5；BiasN 需长时数据）。
    imuAccNoise: 3.9939570888238808e-03
    imuGyrNoise: 1.5636343949698187e-03
    imuAccBiasN: 6.4356659353532566e-05
    imuGyrBiasN: 3.5640318696367613e-05

    # 实测静止加速度模长 9.7278（与传感器自身刻度一致，保证预积分自洽）
    imuGravity: 9.72782
    imuRPYWeight: 0.01

    # extrinsic（extrinsicTrans/extrinsicRot/extrinsicRPY）由 run.launch.py 从
    # vehicle_config 注入，唯一数据源为 src/vehicle_config/config/real_vehicle.yaml
    # 的 sensors.imu.mount + sensors.lidar.mount。此处不要写死，避免与注入值冲突。
    # LIO-SAM 代码对此三者有 identity/零平移默认值，缺省时仅失去外参补偿。

    # LOAM feature threshold
    edgeThreshold: 1.0
    surfThreshold: 0.1
    edgeFeatureMinValidNum: 10
    surfFeatureMinValidNum: 100

    # voxel filter paprams
    odometrySurfLeafSize: 0.2                     # default: 0.4 - outdoor, 0.2 - indoor
    mappingCornerLeafSize: 0.1                    # default: 0.2 - outdoor, 0.1 - indoor
    mappingSurfLeafSize: 0.2                      # default: 0.4 - outdoor, 0.2 - indoor

    # robot motion constraint (in case you are using a 2D robot)
    z_tollerance: 1000.0                          # meters
    rotation_tollerance: 1000.0                   # radians

    # CPU Params
    numberOfCores: 4                              # number of cores for mapping optimization
    mappingProcessInterval: 0.15                  # seconds, regulate mapping frequency

    # Surrounding map
    surroundingkeyframeAddingDistThreshold: 0.5   # meters, regulate keyframe adding threshold
    surroundingkeyframeAddingAngleThreshold: 0.2  # radians, regulate keyframe adding threshold
    surroundingKeyframeDensity: 2.0               # meters, downsample surrounding keyframe poses   
    surroundingKeyframeSearchRadius: 15.0         # meters, within n meters scan-to-map optimization
    # (when loop closure disabled)

    # Loop closure
    loopClosureEnableFlag: true
    loopClosureFrequency: 1.0                     # Hz, regulate loop closure constraint add frequency
    surroundingKeyframeSize: 50                   # submap size (when loop closure enabled)
    historyKeyframeSearchRadius: 5.0             # meters, key frame that is within n meters from
    # current pose will be considerd for loop closure
    historyKeyframeSearchTimeDiff: 30.0           # seconds, key frame that is n seconds older will be
    # considered for loop closure
    historyKeyframeSearchNum: 25                  # number of hostory key frames will be fused into a
    # submap for loop closure
    historyKeyframeFitnessScore: 0.3              # icp threshold, the smaller the better alignment

    # Visualization
    globalMapVisualizationSearchRadius: 50.0    # meters, global map visualization radius
    globalMapVisualizationPoseDensity: 10.0       # meters, global map visualization keyframe density
    globalMapVisualizationLeafSize: 1.0           # meters, global map visualization cloud density
